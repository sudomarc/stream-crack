name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show tag
        run: echo "Tag: ${GITHUB_REF_NAME}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

      - name: Build release
        run: cargo build --release --locked

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb
        id: deb
        run: |
          TAG=${{ github.ref_name }}
          DEB="streamcrack_${TAG}_amd64.deb"
          rm -rf pkg/build
          mkdir -p pkg/build/DEBIAN pkg/build/usr/bin pkg/build/usr/share/doc/streamcrack pkg/build/usr/share/man/man1
          cp target/release/streamcrack pkg/build/usr/bin/streamcrack
          chmod 0755 pkg/build/usr/bin/streamcrack
          cp README.md pkg/build/usr/share/doc/streamcrack/README.md
          cp LICENSE pkg/build/usr/share/doc/streamcrack/LICENSE 2>/dev/null || true
          gzip -c pkg/build/usr/share/man/man1/streamcrack.1 > pkg/build/usr/share/man/man1/streamcrack.1.gz 2>/dev/null || true
          cat > pkg/build/DEBIAN/control << 'EOF'
Package: streamcrack
Version: 0.1.0-1
Section: net
Priority: optional
Architecture: amd64
Maintainer: StreamCrack Team <release@streamcrack.example.org>
Installed-Size: 1800
Depends: libc6
Description: WPA2 Wi-Fi password auditing and recovery tool
 StreamCrack is an offline WPA2 Wi-Fi password auditing and recovery tool.
 It inspects local PCAP/PCAPNG capture files for metadata, extracts WPA2
 4-way handshakes, and performs authorized offline PSK recovery
 (dictionary or mask cracking) against captured handshakes. It features a
 keyboard-driven terminal interface and does not perform live capture,
 packet injection, or deauthentication.
Homepage: https://sudomarc.github.io/stream-crack/
EOF
          dpkg-deb --build --root-owner-group pkg/build "$DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - name: Import GPG key
        if: env.STREAMCRACK_GPG_PRIVATE_KEY != ''
        run: echo "${STREAMCRACK_GPG_PRIVATE_KEY}" | gpg --batch --import
        env:
          STREAMCRACK_GPG_PRIVATE_KEY: ${{ secrets.STREAMCRACK_GPG_PRIVATE_KEY }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: StreamCrack ${{ github.ref_name }}
          body: |
            # StreamCrack ${{ github.ref_name }}

            WPA2 Wi-Fi password auditing and recovery tool.

            ## Installation

            ### APT (recommended)
            ```bash
            echo "deb [signed-by=/etc/apt/keyrings/streamcrack.gpg] https://sudomarc.github.io/stream-crack/apt/ stable main" | sudo tee /etc/apt/sources.list.d/streamcrack.list
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://sudomarc.github.io/stream-crack/apt/streamcrack.gpg | sudo tee /etc/apt/keyrings/streamcrack.gpg > /dev/null
            sudo apt update
            sudo apt install streamcrack
            ```

            ### Direct .deb download
            ```bash
            curl -LO https://github.com/sudomarc/stream-crack/releases/download/${{ github.ref_name }}/streamcrack_${{ github.ref_name }}_amd64.deb
            sudo apt install ./streamcrack_${{ github.ref_name }}_amd64.deb
            ```
          draft: false
          prerelease: false

      - name: Upload .deb
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.deb.outputs.deb }}

      - name: Update APT repo
        if: env.STREAMCRACK_GPG_PRIVATE_KEY != ''
        env:
          STREAMCRACK_GPG_PRIVATE_KEY: ${{ secrets.STREAMCRACK_GPG_PRIVATE_KEY }}
          STREAMCRACK_GPG_PASSPHRASE: ${{ secrets.STREAMCRACK_GPG_PASSPHRASE }}
          STREAMCRACK_GPG_NAME: ${{ secrets.STREAMCRACK_GPG_NAME }}
          STREAMCRACK_APT_DIST: stable
        run: |
          DEB=${{ steps.deb.outputs.deb }}
          TAG=${{ github.ref_name }}
          mkdir -p docs/apt/pool/main/s/streamcrack
          cp "$DEB" docs/apt/pool/main/s/streamcrack/
          cd docs/apt
          dpkg-scanpackages --arch amd64 pool/main/s/streamcrack > dists/${STREAMCRACK_APT_DIST}/main/binary-amd64/Packages
          gzip -k -9 dists/${STREAMCRACK_APT_DIST}/main/binary-amd64/Packages
          apt-ftparchive release dists/${STREAMCRACK_APT_DIST} > dists/${STREAMCRACK_APT_DIST}/Release
          gpg --batch --yes --local-user "${STREAMCRACK_GPG_NAME}" --armor --output dists/${STREAMCRACK_APT_DIST}/InRelease --clearsign dists/${STREAMCRACK_APT_DIST}/Release
          gpg --batch --yes --local-user "${STREAMCRACK_GPG_NAME}" --armor --detach-sign --output dists/${STREAMCRACK_APT_DIST}/Release.gpg dists/${STREAMCRACK_APT_DIST}/Release
          cp streamcrack.gpg dists/${STREAMCRACK_APT_DIST}/streamcrack.gpg 2>/dev/null || true
          cd ../..
          git config user.name "StreamCrack Release Bot"
          git config user.email "release@streamcrack.example.org"
          git add docs/apt/
          git commit -m "chore(release): update APT repository for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main || echo "Push failed"
