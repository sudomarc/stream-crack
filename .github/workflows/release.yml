name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: false

permissions:
  contents: write
  pages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Get release tag
        id: get_tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *//;s/\"//g')"
            echo "No tag provided, deriving from Cargo.toml: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Run full test suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb package
        id: build_deb
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          DEB="streamcrack_${TAG}_amd64.deb"
          rm -rf pkg/build && mkdir -p pkg/build/DEBIAN pkg/build/usr/bin pkg/build/usr/share/doc/streamcrack pkg/build/usr/share/man/man1
          cp target/release/streamcrack pkg/build/usr/bin/streamcrack
          chmod 0755 pkg/build/usr/bin/streamcrack
          cp README.md pkg/build/usr/share/doc/streamcrack/README.md
          cp LICENSE pkg/build/usr/share/doc/streamcrack/LICENSE 2>/dev/null || true
          cp man/streamcrack.1 pkg/build/usr/share/man/man1/streamcrack.1 2>/dev/null || true
          gzip -c pkg/build/usr/share/man/man1/streamcrack.1 > pkg/build/usr/share/man/man1/streamcrack.1.gz 2>/dev/null || true
          cat > pkg/build/DEBIAN/control << CONTROLEOF
Package: streamcrack
Version: ${TAG#v}
Section: net
Priority: optional
Architecture: amd64
Maintainer: StreamCrack Team <release@streamcrack.example.org>
Installed-Size: 1800
Depends: libc6
Description: WPA2 Wi-Fi password auditing and recovery tool
 StreamCrack is an offline WPA2 Wi-Fi password auditing and recovery tool.
 It inspects local PCAP/PCAPNG capture files for metadata, extracts WPA2
 4-way handshakes, and performs authorized offline PSK recovery
 (dictionary or mask cracking) against captured handshakes. It features a
 keyboard-driven terminal interface and does not perform live capture,
 packet injection, or deauthentication.
Homepage: https://sudomarc.github.io/stream-crack/
CONTROLEOF
          dpkg-deb --build --root-owner-group pkg/build "$DEB"
          ls -la "$DEB"
          echo "deb=$DEB" >> $GITHUB_OUTPUT

      - name: Import GPG signing key
        if: secrets.STREAMCRACK_GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.STREAMCRACK_GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "GPG key imported"

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: StreamCrack ${{ steps.get_tag.outputs.tag }}
          body: |
            # StreamCrack ${{ steps.get_tag.outputs.tag }}

            WPA2 Wi-Fi password auditing and recovery tool.

            ## Installation

            ### APT (recommended)
            ```bash
            # Add the StreamCrack APT repository
            echo "deb [signed-by=/etc/apt/keyrings/streamcrack.gpg] https://sudomarc.github.io/stream-crack/apt/ stable main" | sudo tee /etc/apt/sources.list.d/streamcrack.list

            # Add the signing key
            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://sudomarc.github.io/stream-crack/apt/streamcrack.gpg | sudo tee /etc/apt/keyrings/streamcrack.gpg > /dev/null

            # Install
            sudo apt update
            sudo apt install streamcrack
            ```

            ### Direct .deb download
            ```bash
            curl -LO https://github.com/sudomarc/stream-crack/releases/download/${{ steps.get_tag.outputs.tag }}/streamcrack_${{ steps.get_tag.outputs.tag }}_amd64.deb
            sudo apt install ./streamcrack_${{ steps.get_tag.outputs.tag }}_amd64.deb
            ```

            ### From source
            ```bash
            git clone https://github.com/sudomarc/stream-crack.git
            cd stream-crack
            cargo build --release
            ```
          draft: false
          prerelease: false

      - name: Upload .deb as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: ${{ steps.build_deb.outputs.deb }}

      - name: Update APT repository and commit
        if: secrets.STREAMCRACK_GPG_PRIVATE_KEY != ''
        run: |
          DEB="${{ steps.build_deb.outputs.deb }}"
          TAG="${{ steps.get_tag.outputs.tag }}"
          mkdir -p docs/apt/pool/main/s/streamcrack
          cp "$DEB" docs/apt/pool/main/s/streamcrack/
          cd docs/apt
          dpkg-scanpackages --arch amd64 pool/main/s/streamcrack > dists/${STREAMCRACK_APT_DIST}/main/binary-amd64/Packages
          gzip -k -9 dists/${STREAMCRACK_APT_DIST}/main/binary-amd64/Packages
          apt-ftparchive release dists/${STREAMCRACK_APT_DIST} > dists/${STREAMCRACK_APT_DIST}/Release
          gpg --batch --yes --local-user "${STREAMCRACK_GPG_NAME}" --armor --output dists/${STREAMCRACK_APT_DIST}/InRelease --clearsign dists/${STREAMCRACK_APT_DIST}/Release
          gpg --batch --yes --local-user "${STREAMCRACK_GPG_NAME}" --armor --detach-sign --output dists/${STREAMCRACK_APT_DIST}/Release.gpg dists/${STREAMCRACK_APT_DIST}/Release
          cp streamcrack.gpg dists/${STREAMCRACK_APT_DIST}/streamcrack.gpg 2>/dev/null || cp ../streamcrack.gpg dists/${STREAMCRACK_APT_DIST}/streamcrack.gpg
          cd ../..
          git config user.name "StreamCrack Release Bot"
          git config user.email "release@streamcrack.example.org"
          git add docs/apt/
          git commit -m "chore(release): update APT repository for ${{ steps.get_tag.outputs.tag }}" || echo "No changes to commit"
          git push origin main || echo "Push failed"
        env:
          STREAMCRACK_GPG_NAME: ${{ secrets.STREAMCRACK_GPG_NAME }}
